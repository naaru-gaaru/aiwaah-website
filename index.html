<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>AiWaah!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Aref+Ruqaa:wght@400;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="assets/AiWaah_new.png" />
  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

  <!-- Fixed Header -->
  <header class="app-header">
    <div class="header-inner">
      <!-- Left: Logo -->
      <div class="header-left">
        <img src="assets/AiWaah_new.png" alt="AiWaah logo" class="app-logo" />
      </div>

      <!-- Center: Title -->
      <div class="header-center">
        <div class="app-title">AiWaah!</div>
        <div class="app-subtitle">
          Your CFP & CPA Financial Genie
        </div>
        <div class="app-markets">
          🇺🇸 United States • 🇨🇦 Canada • 🌍 US Trans-Border
        </div>
      </div>

      <!-- Right: Auth -->
      <div class="header-right">
        <!-- User Info (Hidden by default) -->
        <div id="user-info" class="user-info" style="display: none;">
          <img id="user-avatar" src="" alt="Avatar" class="user-avatar" />
          <span id="user-name" class="user-name"></span>
        </div>

        <button id="login-google" class="login-btn">
          🔐 Sign in with Google
        </button>
        <button id="logout-btn" class="login-btn" style="display: none;">
          🚪 Sign out
        </button>
      </div>
    </div>
  </header>


  <!-- Main Chat Area -->
  <main class="chat-wrapper">
    <div id="chat" class="chat"></div>
  </main>

  <!-- Input Bar -->
  <div class="input-bar">
    <form id="chat-form">
      <input id="user-input" type="text" placeholder="Summon AiWaah for wealth, taxes & financial desires.."
        autocomplete="off" />
      <button type="submit" id="send-btn" class="send-btn">✨ Send</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>

</html>
